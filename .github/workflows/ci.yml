# CI：后端测试 + 敏感面门禁 + 前端构建门禁。
#
# **为什么后端跑 windows-latest 而不是 ubuntu**：这不是偏好问题——本产品是
# Windows 专用的（`mihomo.exe`、pywebview/WebView2、`run.py` 的自重入与 .bat
# 启动器、`paths.py` 里的 %LOCALAPPDATA% 判定链）。在 Linux 上跑 pytest 会得到
# 一批「与真实运行环境无关的失败」，那种红灯没人会当真，最后就是全员忽略 CI。
# 前端是平台中立的，仍然跑 ubuntu（更快、更便宜）。
#
# 触发条件刻意包含 push 到 main：本项目出过「工作区被整包推送」的事故，
# 每次推到 main 都重跑一遍门禁，等于给那条路径加一道事后告警。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一轮未完成的运行，省 runner 也少噪音
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Python ${{ matrix.python-version }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声明 3.11+，本机开发环境是 3.13——取两端做矩阵：
        # 只测一端就会让「声明支持但从未运行」的版本悄悄坏掉。
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: 敏感面门禁（凭据 / 大文件 / 用户数据）
        # 放在测试之前：门禁失败时没必要再花几分钟跑测试
        run: python scripts/check_secrets.py --all

      - name: 后端测试
        run: python -m pytest -q

  frontend:
    name: 前端（Node ${{ matrix.node-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # **不能写 18**：vite 8 与 eslint 10 的 engines 交集是
        # ^20.19.0 || ^22.13.0 || >=24，18 上 npm ci 会直接拒绝。
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建（含 lint 硬门禁与路由完整性检查）
        working-directory: web
        run: npm run build
