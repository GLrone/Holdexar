# CI：后端测试 + 敏感面门禁 + 前端构建门禁。
#
# 仅在 Actions 页手动触发（workflow_dispatch），不随 push / PR 自动运行；
# 常规验证由开发会话内的靶向测试与真实链路实测承担，发布前手动跑一次本
# 工作流或本地全量。timeout-minutes 兜底：单 job 卡死最多 45 分钟必出结论，
# 不无限占用 runner。
#
# 后端跑 windows-latest 而不是 ubuntu：本产品是 Windows 专用的（`mihomo.exe`、
# pywebview/WebView2、`run.py` 的自重入与 .bat 启动器、`paths.py` 里的
# %LOCALAPPDATA% 判定链），Linux 上跑 pytest 会得到一批「与真实运行环境无关
# 的失败」；前端平台中立，跑 ubuntu（更快、更便宜）。
# 后端仅测 3.13（本机开发环境版本）：更老的 3.11 不再验证，README 的「3.11+」
# 声明不获测试背书；静态检查（ruff/mypy target 3.11）不受影响。

name: CI

on:
  workflow_dispatch:

# 同一分支的新触发取消上一轮未完成的运行，省 runner 也少噪音
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Python 3.13）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: 敏感面门禁（凭据 / 大文件 / 用户数据）
        # 放在测试之前：门禁失败时没必要再花几分钟跑测试
        run: python scripts/check_secrets.py --all

      - name: 后端测试
        run: python -m pytest -q

  frontend:
    name: 前端（Node ${{ matrix.node-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # **不能写 18**：vite 8 与 eslint 10 的 engines 交集是
        # ^20.19.0 || ^22.13.0 || >=24，18 上 npm ci 会直接拒绝。
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建（含 lint 硬门禁与路由完整性检查）
        working-directory: web
        run: npm run build
