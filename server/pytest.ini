[pytest]
testpaths = tests
# aiosqlite 连接线程在所属事件循环关闭后的收尾回调（call_soon_threadsafe 打到
# 已关 loop）会以线程异常 warning 收场：本地 GC 时机不同可零命中，云端 runner
# 的 GC/线程时序把它放大成成片「Event loop is closed」——GitHub 日志里每条
# traceback 行都带 ##[error] 标记，被转成 error 注解（测试结论本身不受影响）。
# 测试建的引擎靠 GC 兜底关闭属测试语境内的既有形态，此处只对齐两端的表现。
filterwarnings =
    ignore:Exception in thread:pytest.PytestUnhandledThreadExceptionWarning
